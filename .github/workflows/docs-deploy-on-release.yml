name: Docs Site Redeploy

# Ping Cloudflare Pages to rebuild the docs site outside the normal push-to-master flow.
# Two docs pages are generated from GitHub data at BUILD time — the changelog (from
# Releases) and What's Next (from milestones/issues) — but Cloudflare only rebuilds on
# pushes to master, so GitHub-side-only changes don't appear until the next deploy.
#
# Triggers:
#   - release published/edited via the GitHub UI → keeps the changelog fresh.
#   - manual workflow_dispatch (Actions → "Docs Site Redeploy" → Run workflow, or
#     `gh workflow run docs-deploy-on-release.yml`) → refresh on demand, e.g. after a
#     round of issue/milestone consolidation so What's Next reflects it immediately.
#
# NOTE: releases cut by release.yml use GITHUB_TOKEN, and GitHub does NOT trigger
# workflows from GITHUB_TOKEN-created events — so the release trigger does NOT fire for
# the /release flow. release.yml pings the deploy hook itself for that path; this
# workflow covers Releases published/edited manually via the GitHub UI, plus dispatch.
#
# Setup (one-time): in the Cloudflare Pages "bridgeport" project →
#   Settings → Builds & deployments → Deploy hooks → create a hook (production / master),
#   then store its URL as the repo secret CLOUDFLARE_DEPLOY_HOOK
#   (repo Settings → Secrets and variables → Actions).
# Until the secret is set, this workflow is a no-op (it skips, it doesn't fail).

on:
  release:
    types: [published, edited]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-deploy-on-release
  cancel-in-progress: true

jobs:
  trigger:
    name: Trigger Cloudflare Pages rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST the Cloudflare deploy hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK secret not set — skipping (add it to enable changelog/roadmap refreshes)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" >/dev/null && echo "Triggered Cloudflare Pages rebuild of the docs site."
